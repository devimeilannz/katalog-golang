# Menjalankan PostgreSQL 15 dan migrasi tanpa perlu install apa pun selain Docker.
services:
  db:
    image: postgres:15-alpine
    container_name: katalog-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-katalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-katalog123}
      POSTGRES_DB: ${POSTGRES_DB:-katalog_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-katalog} -d $${POSTGRES_DB:-katalog_db}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Dijalankan lewat: docker compose run --rm migrate up | down 1
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-katalog}:${POSTGRES_PASSWORD:-katalog123}@db:5432/${POSTGRES_DB:-katalog_db}?sslmode=disable

volumes:
  pgdata:
